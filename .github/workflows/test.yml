# Runs all the unit tests on every branch except main (main's release workflow runs them too),
# so a change is checked before it is merged.
name: Tests

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      # The Google Play build has no Aptabase: it must compile on its own too.
      - name: Compile the Play build
        env:
          FRANXIT_PLAY: "true"
        run: ./gradlew compileReleaseKotlin --console=plain
