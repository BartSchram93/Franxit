# Runs all the unit tests on every branch except main (main's release workflow runs them too),
# so a change is checked before it is merged.
name: Tests

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The search service's product search (Exa) and suggestions, with those services stood in for.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search service tests
        run: node worker/search-proxy.test.mjs

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :core:test testWebDebugUnitTest --console=plain

      # The Play bundle must compile and package (unsigned here). No APK is built any more.
      - name: Build the Play bundle
        run: |
          ./gradlew bundlePlayRelease --console=plain
          ls -l app/build/outputs/bundle/playRelease/
