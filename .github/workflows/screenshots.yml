# Screenshots of the real app (the Google Play build) on an emulator, for the Play Console: phone and
# tablet. The app starts empty, searches vergelijk.be like a user and tracks products (see
# DemoScreenshots): every price, shop and price history comes from the live site, nothing is invented.
# Download the images from the run page (Artifacts).
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [play-shots]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: phone, profile: pixel_6, lang: DUTCH }
          - { name: tablet, profile: pixel_tablet, lang: DUTCH }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the test
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew assemblePlayDebug assemblePlayDebugAndroidTest --console=plain

      - name: Take the screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/play/debug/app-play-debug.apk
            adb install -r app/build/outputs/apk/androidTest/play/debug/app-play-debug-androidTest.apk
            adb shell settings put global hide_error_dialogs 1
            adb shell pm grant com.bartschram.franxit android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e lang ${{ matrix.lang }} -e class com.bartschram.franxit.DemoScreenshots com.bartschram.franxit.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p shots
            adb pull /sdcard/Android/data/com.bartschram.franxit/files/shots/. shots/
            ls -l shots

      # Google Play wants phone screenshots no taller than 2:1: without the status bar and the
      # navigation bar the emulator's 1080 x 2400 becomes 1080 x 2160.
      - name: Fit the phone images to Google Play
        if: ${{ matrix.name == 'phone' }}
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          for f in glob.glob("shots/*.png"):
              if "debug" in f: continue
              im = Image.open(f).convert("RGB")
              im.crop((0, 120, im.width, 120 + im.width * 2)).save(f)
              print(f, Image.open(f).size)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: shots/*
