# Takes screenshots of the real app on an emulator with made-up demo products (see
# DemoScreenshots) and puts them on the "screenshot-images" branch, for the download page.
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [demo-shots]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain

      - name: Take the screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.bartschram.franxit android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e class com.bartschram.franxit.DemoScreenshots com.bartschram.franxit.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p shots
            adb pull /sdcard/Android/data/com.bartschram.franxit/files/shots/. shots/
            ls -l shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*

      - name: Put the screenshots on the screenshot-images branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screenshots-out
          git rm -rf -q . || true
          cp shots/* .
          git add .
          git commit -q -m "Screenshots from run ${{ github.run_number }}"
          git push -f origin HEAD:screenshot-images
