# Builds a signed APK on every push to main and publishes it as a GitHub Release,
# so Obtainium on the phone can pick it up and update the app.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Without the signing secrets the tests and the build still run, but nothing is published.
      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.FRANXIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key yet: add the secrets FRANXIT_KEYSTORE_BASE64 and FRANXIT_KEYSTORE_PASSWORD, then run this workflow again."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # The version counts from 1 again (the workflow had run 39 times before the fresh start).
      - name: Version
        run: echo "BUILD=$((GITHUB_RUN_NUMBER - 39))" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          FRANXIT_KEYSTORE: ${{ steps.key.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          FRANXIT_KEYSTORE_PASSWORD: ${{ secrets.FRANXIT_KEYSTORE_PASSWORD }}
          FRANXIT_KEY_ALIAS: franxit
          FRANXIT_BUILD: ${{ env.BUILD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ env.BUILD }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "franxit-$VERSION.apk"
          git log -1 --pretty=%B > notes.txt
          gh release create "v$VERSION" "franxit-$VERSION.apk" \
            --title "Franxit $VERSION" --notes-file notes.txt --target "$GITHUB_SHA"

      # The public download page: the same APK as a release in the public repo (it needs the secret
      # PUBLIC_REPO_TOKEN, a token that can write to that repo). The page and the app's update
      # notice both read the latest release there.
      - name: Publish to the download page
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: 1.0.${{ env.BUILD }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No PUBLIC_REPO_TOKEN secret: the download page isn't updated."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk franxit.apk
          # The first line of whats-new.txt is what the app shows people ("New version available").
          NOTES="$(head -n 1 whats-new.txt 2>/dev/null)"
          [ -n "$NOTES" ] || NOTES="Small improvements."
          gh release create "v$VERSION" franxit.apk --repo BartSchram93/franxit-download \
            --title "Franxit $VERSION" --notes "$NOTES"
