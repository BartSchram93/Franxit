# On every push to main: runs the tests, builds the signed Play bundle and sends it to Google Play's closed test.
# No APK is built or published any more: the app is only distributed through Google Play.
name: Release

on:
  push:
    branches: [main]
    # Only the quota check changed: no new release for that.
    paths-ignore:
      - ".github/workflows/serpapi-quota.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Send the bundle to Google Play (no = only build, keep the bundle)"
        type: boolean
        default: true

permissions:
  contents: read
  # To prove to Google that a run is this repository's (Workload Identity Federation): no key is stored anywhere.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Without the signing secrets the tests and the build still run, but nothing is published.
      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.FRANXIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key yet: add the secrets FRANXIT_KEYSTORE_BASE64 and FRANXIT_KEYSTORE_PASSWORD, then run this workflow again."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # The version counts from 1 again (the workflow had run 41 times before the fresh start).
      - name: Version
        run: echo "BUILD=$((GITHUB_RUN_NUMBER - 41))" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          FRANXIT_KEYSTORE: ${{ steps.key.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          FRANXIT_KEYSTORE_PASSWORD: ${{ secrets.FRANXIT_PLAY_KEYSTORE_PASSWORD || secrets.FRANXIT_KEYSTORE_PASSWORD }}
          FRANXIT_KEY_ALIAS: ${{ secrets.FRANXIT_PLAY_KEY_ALIAS || 'franxit' }}
          FRANXIT_BUILD: ${{ env.BUILD }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test testWebDebugUnitTest --console=plain

      # The bundle for Google Play, signed with Play's upload key (FRANXIT_KEYSTORE_BASE64 with the PLAY password and
      # alias). Sent to Play Console at the end, and kept on this run's page (Artifacts) too.
      - name: Play bundle
        if: steps.key.outputs.signed == 'true'
        env:
          FRANXIT_KEYSTORE: ${{ runner.temp }}/release.jks
          FRANXIT_KEYSTORE_PASSWORD: ${{ secrets.FRANXIT_PLAY_KEYSTORE_PASSWORD || secrets.FRANXIT_KEYSTORE_PASSWORD }}
          FRANXIT_KEY_ALIAS: ${{ secrets.FRANXIT_PLAY_KEY_ALIAS || 'franxit' }}
          FRANXIT_BUILD: ${{ env.BUILD }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: ./gradlew bundlePlayRelease --console=plain

      - name: Keep the Play bundle
        if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: franxit-play-bundle
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 30

      # Google Play: signed in as the service account franxit-upload through GitHub's own proof that this run is
      # BartSchram93/Franxit's (no key or secret). Only Google's access rules let it in: see Workload Identity
      # Federation in the Google Cloud project.
      - name: Sign in to Google Play
        id: google
        if: steps.key.outputs.signed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/398699754135/locations/global/workloadIdentityPools/github/providers/franxit
          service_account: franxit-upload@project-0fb84039-09ad-4327-811.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # The bundle as a release on the closed test, with play-notes/<language>.txt as its notes, sent to Google
      # for review at once.
      - name: Upload to Google Play
        if: steps.key.outputs.signed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
          VERSION: 1.0.${{ env.BUILD }}
        run: |
          set -euo pipefail
          API=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.bartschram.franxit
          # Google's own words when it refuses (no rights yet in Play Console, a language it doesn't know, ...).
          call() {
            local out code
            out=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $TOKEN" "$@")
            code=${out##*$'\n'}; out=${out%$'\n'*}
            if [ "$code" -ge 400 ]; then echo "::error::Google Play $code: $(jq -r '.error.message? // .' <<< "$out" 2>/dev/null || echo "$out")" >&2; return 1; fi
            printf '%s' "$out"
          }
          EDIT=$(call -X POST "$API/edits" -H "Content-Type: application/json" -d '{}' | jq -r .id)
          CODE=$(call -X POST "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/com.bartschram.franxit/edits/$EDIT/bundles?uploadType=media" \
            -H "Content-Type: application/octet-stream" --data-binary @app/build/outputs/bundle/playRelease/app-play-release.aab | jq -r .versionCode)
          # Only the languages the store listing has (Google refuses notes in any other), each with the notes in its
          # language: play-notes/nl-BE.txt also for a listing in nl-NL.
          LANGS=$(call "$API/edits/$EDIT/listings" | jq -r '.listings[]?.language')
          echo "Store listing languages:" $LANGS
          NOTES=$(for l in $LANGS; do f=play-notes/$l.txt; [ -f "$f" ] || f=$(ls play-notes/"${l%%-*}"*.txt 2>/dev/null | head -1)
            [ -n "$f" ] || continue
            jq -n --arg l "$l" --rawfile t "$f" '{language: $l, text: ($t | rtrimstr("\n"))}'; done | jq -s .)
          jq -n --arg track "$TRACK" --arg code "$CODE" --arg name "$VERSION" --argjson notes "$NOTES" \
            '{track: $track, releases: [{name: $name, versionCodes: [$code], status: "completed", releaseNotes: $notes}]}' > track.json
          call -X PUT "$API/edits/$EDIT/tracks/$TRACK" -H "Content-Type: application/json" --data @track.json > /dev/null
          call -X POST "$API/edits/$EDIT:commit" > /dev/null
          echo "Version $VERSION ($CODE) is sent on the track $TRACK in Play Console."
