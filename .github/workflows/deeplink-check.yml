# Does a shared product link open Franxit? Installs the released, signed app on an emulator and opens a link
# the way a message app would. The answer is in the log and the screenshot.
name: Deeplink check

on:
  push:
    branches: [deeplink-check]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The released app
        run: curl -fsSL -o franxit.apk https://github.com/BartSchram93/franxit-download/releases/latest/download/franxit.apk && ls -l franxit.apk
      - name: Check the link on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r franxit.apk
            adb shell pm get-app-links com.bartschram.franxit > shots/links-before.txt
            adb shell pm verify-app-links --re-verify com.bartschram.franxit
            sleep 40
            adb shell pm get-app-links com.bartschram.franxit > shots/links-after.txt
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell "am start -a android.intent.action.VIEW -d 'https://franxit.be/p/?u=https%3A%2F%2Fwww.coolblue.be%2Fnl%2Fproduct%2F941836%2Fplaystation-5-slim-digital-edition.html'" > shots/start.txt
            sleep 12
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > shots/focus.txt
            adb exec-out screencap -p > shots/dl-1-after-open.png
            echo "=== links before"; cat shots/links-before.txt
            echo "=== links after"; cat shots/links-after.txt
            echo "=== start"; cat shots/start.txt
            echo "=== focus"; cat shots/focus.txt
      - name: Keep the result
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan check-out
          git rm -rf -q . || true
          cp shots/* . || true
          git add . && git commit -q -m "Deeplink check ${{ github.run_number }}" && git push -f origin HEAD:deeplink-check-out
