# Does a shared product link open Franxit? One emulator run; the answer is in the log and the screenshot.
name: Deeplink check

on:
  push:
    branches: [deeplink-check]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and the test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - name: Check the link on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put global hide_error_dialogs 1
            adb shell am instrument -w -e class com.bartschram.franxit.DeepLinkCheck com.bartschram.franxit.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p shots
            adb pull /sdcard/Android/data/com.bartschram.franxit/files/shots/. shots/
            echo "=== link"; cat shots/link.txt
            echo; echo "=== foreground"; cat shots/foreground.txt
            echo; echo "=== links before"; cat shots/links-before.txt
            echo "=== links after"; cat shots/links-after.txt
      - name: Keep the result
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan check-out
          git rm -rf -q . || true
          cp shots/* . || true
          git add . && git commit -q -m "Deeplink check ${{ github.run_number }}" && git push -f origin HEAD:deeplink-check-out
